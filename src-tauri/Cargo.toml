[package]
name = "yuni-orb"
version = "0.1.0"
description = "Yuni Orb quest session dashboard"
authors = ["Yuni"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "updater", "custom-protocol", "system-tray", "api-all"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
discord-rich-presence = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.48"
features = [
    "Win32_System_Power"
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
